<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>maped</title>
  </head>
  <body>
    <div class="toolbar">
      <label>ID: <input id="brushId" type="number" min="1" max="255" value="1" /></label>
      <button id="eyedropper" title="Eyedropper (Pick from grid)" aria-pressed="false">🎨</button>
      <button id="bucket" title="Flood Fill (toggle)" aria-pressed="false">🪣</button>
      <button id="undo" title="Undo (Ctrl+Z)">↶</button>
      <button id="redo" title="Redo (Ctrl+Y)">↷</button>
      <label title="Fill opacity">Fill: <input id="fillAlpha" type="range" min="0" max="100" value="50" /></label>
      <label>Backdrop: <input id="backdrop" type="file" accept="image/*" /></label>
      <button id="clear" title="Clear entire grid">Clear</button>
      <button id="save" title="Save grid (.maped)">Save</button>
      <button id="load" title="Load grid (.maped)"><input id="loadFile" type="file" accept=".maped" style="display:none" />Load</button>
      <span id="status"></span>
    </div>
    <canvas id="canvas"></canvas>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
