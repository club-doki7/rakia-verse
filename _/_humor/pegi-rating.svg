<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <style>
      .pegi-bg { fill: #1a1a2e; }
      .pegi-card { fill: #ffffff; rx: 12; }
      .pegi-age-bg { fill: #e63946; }
      .pegi-age-text { font-family: Arial Black, Arial, sans-serif; font-size: 72px; font-weight: 900; fill: #ffffff; }
      .pegi-label { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; text-transform: uppercase; }
      .pegi-title { font-family: Arial Black, Arial, sans-serif; font-size: 24px; font-weight: 900; fill: #1a1a2e; }
      .pegi-subtitle { font-family: Arial, sans-serif; font-size: 12px; fill: #555555; }
      .descriptor-box { rx: 6; }
      .descriptor-icon { font-size: 18px; }
      .descriptor-text { font-family: Arial, sans-serif; font-size: 9px; font-weight: bold; fill: #ffffff; text-transform: uppercase; }
      .content-note { font-family: Arial, sans-serif; font-size: 10px; fill: #666666; }
      .footer-text { font-family: Arial, sans-serif; font-size: 9px; fill: #888888; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" class="pegi-bg"/>

  <!-- Main PEGI Card -->
  <rect x="30" y="20" width="540" height="360" rx="12" fill="#ffffff"/>

  <!-- PEGI Age Rating Box -->
  <rect x="50" y="40" width="120" height="140" rx="8" class="pegi-age-bg"/>
  <text x="110" y="75" text-anchor="middle" class="pegi-label">PEGI</text>
  <text x="110" y="148" text-anchor="middle" class="pegi-age-text">18</text>
  <rect x="60" y="160" width="100" height="14" rx="3" fill="#000000"/>
  <text x="110" y="170" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#ffffff">PROVISIONAL</text>

  <!-- Title -->
  <text x="190" y="65" class="pegi-title">RAKIA VERSE</text>
  <text x="190" y="85" class="pegi-subtitle">穹苍宇宙 — Worldbuilding Project (pre-alpha)</text>
  <text x="190" y="105" class="pegi-subtitle">Genre: Dark Fantasy / Theological Cosmology</text>

  <!-- Content Descriptors Row 1 -->
  <!-- Violence -->
  <rect x="190" y="120" width="80" height="50" rx="6" fill="#e63946"/>
  <text x="230" y="145" text-anchor="middle" font-size="20">⚔️</text>
  <text x="230" y="163" text-anchor="middle" class="descriptor-text">VIOLENCE</text>

  <!-- Fear -->
  <rect x="280" y="120" width="80" height="50" rx="6" fill="#6a0572"/>
  <text x="320" y="145" text-anchor="middle" font-size="20">💀</text>
  <text x="320" y="163" text-anchor="middle" class="descriptor-text">FEAR</text>

  <!-- Discrimination -->
  <rect x="370" y="120" width="80" height="50" rx="6" fill="#e85d04"/>
  <text x="410" y="145" text-anchor="middle" font-size="20">⛓️</text>
  <text x="410" y="163" text-anchor="middle" class="descriptor-text">DISCRIM.</text>

  <!-- Sex (implied) -->
  <rect x="460" y="120" width="80" height="50" rx="6" fill="#d90429"/>
  <text x="500" y="145" text-anchor="middle" font-size="20">⚠️</text>
  <text x="500" y="163" text-anchor="middle" class="descriptor-text">SEX*</text>

  <!-- Detailed Content Breakdown -->
  <line x1="50" y1="200" x2="550" y2="200" stroke="#dddddd" stroke-width="1"/>
  <text x="50" y="220" font-family="Arial Black" font-size="12" fill="#1a1a2e">CONTENT ADVISORY BREAKDOWN:</text>

  <!-- Content items in two columns -->
  <text x="60" y="242" class="content-note">✓ 战争与大规模伤亡 (War &amp; Mass Casualties)</text>
  <text x="60" y="258" class="content-note">✓ 宗教迫害与强制改宗 (Religious Persecution)</text>
  <text x="60" y="274" class="content-note">✓ 奴隶制 (Slavery)</text>
  <text x="60" y="290" class="content-note">✓ 酷刑 (Torture)</text>
  <text x="60" y="306" class="content-note">✓ 饥荒 (Famine)</text>
  <text x="60" y="322" class="content-note">✓ 食人 (Cannibalism)</text>

  <text x="320" y="242" class="content-note">✓ 暗示性的性暴力 (Implied Sexual Violence)</text>
  <text x="320" y="258" class="content-note">✓ 尸体操纵 (Corpse Manipulation)</text>
  <text x="320" y="274" class="content-note">✓ 身体恐怖 (Body Horror)</text>
  <text x="320" y="290" class="content-note">✓ 精神退化 (Mental Degradation)</text>
  <text x="320" y="306" class="content-note">✓ 生育控制 (Reproductive Control)</text>
  <text x="320" y="322" class="content-note">✓ 艾什尔里偶因论 (Occasionalism)</text>

  <!-- Footer -->
  <line x1="50" y1="340" x2="550" y2="340" stroke="#dddddd" stroke-width="1"/>
  <text x="50" y="358" class="footer-text">* 仅为暗示性描写，无明确内容。"Occasionalism" 系指可能导致存在主义危机的形而上学内容。</text>
  <text x="50" y="372" class="footer-text">本分级为戏仿创作，不代表 PEGI 官方评级。抵制扭曲世设，拒绝搬运洗稿。合理安排时间，享受健康生活。</text>
</svg>
