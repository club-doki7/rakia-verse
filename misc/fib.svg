<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#c9a820"/>
      <stop offset="100%" style="stop-color:#f4d03f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#080820"/>

  <!-- Border -->
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="url(#gold)" stroke-width="2.5" />
  <rect x="27" y="27" width="746" height="396" fill="none" stroke="url(#gold)" stroke-width="0.8" />

  <!-- FIB WARNING title -->
  <text x="400" y="92" font-family="'Times New Roman', serif" font-size="32" font-weight="bold"
        fill="url(#gold)" text-anchor="middle" letter-spacing="10" filter="url(#glow)">FIB WARNING</text>

  <!-- Horizontal rule -->
  <line x1="133" y1="119" x2="667" y2="119" stroke="#ffd900" stroke-width="2" opacity="0.6"/>

  <!-- Content warning body -->
  <text font-family="serif" font-size="14" fill="#e0e0e0" text-anchor="middle">
    <tspan x="400" y="162">本作品包含以下内容，不适合 15 岁以下读者：</tspan>
  </text>

  <text font-family="serif" font-size="14" fill="#cccccc" text-anchor="middle">
    <tspan x="400" y="193">战争与大规模伤亡 · 宗教迫害与强制改宗 · 奴隶制</tspan>
    <tspan x="400" dy="22">酷刑 · 饥荒 · 食人 · 暗示性的性暴力</tspan>
    <tspan x="400" dy="22">尸体操纵 · 身体恐怖 · 精神退化 · 生育控制</tspan>
  </text>

  <!-- Separator -->
  <line x1="233" y1="258" x2="567" y2="258" stroke="#444" stroke-width="0.5"/>

  <!-- Legal text -->
  <text font-family="serif" font-size="12" fill="#a0a0b8" text-anchor="middle">
    <tspan x="400" y="293">上述描写仅为虚构叙事之需要，</tspan>
    <tspan x="400" dy="18">不代表作者对相关行为的认可、美化或鼓励。</tspan>
  </text>

  <!-- Bottom advisory -->
  <text font-family="serif" font-size="10" fill="#7f7f80" text-anchor="middle">
    <tspan x="400" y="367">抵制扭曲世设，拒绝搬运洗稿。注意自我保护，谨防受骗上当。</tspan>
    <tspan x="400" dy="16">适度创作益脑，沉溺幻想伤身。合理安排时间，享受健康生活。</tspan>
  </text>

  <!-- Footer -->
  <text x="400" y="403" font-family="'Courier New', serif, monospace" font-size="9" fill="#7f7f80"
        text-anchor="middle" letter-spacing="2">RAKIA VERSE · 穹苍宇宙 · CC-BY-NC-SA-4.0</text>
</svg>
